name: OPSENTINEL CI/CD Pipeline

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # STAGE 1: TESTS (Backend Ruff + Pytest w/ pgvector & Redis + Frontend Vitest)
  # ===========================================================================
  tests:
    name: "1. Tests (pgvector + Redis + Vitest)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsentinel
          POSTGRES_PASSWORD: opsentinel
          POSTGRES_DB: opsentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsentinel -d opsentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint backend with Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Run backend Pytest suite against live PostgreSQL + pgvector & Redis
        working-directory: backend
        env:
          CI_USE_EXTERNAL_SERVICES: "true"
          DATABASE_URL: "postgresql+psycopg://opsentinel:opsentinel@localhost:5432/opsentinel_test"
          REDIS_URL: "redis://localhost:6379/1"
          AUTO_FALLBACK_SQLITE: "false"
          AUTO_FALLBACK_FAKEREDIS: "false"
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck & run Frontend Vitest suite
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test

  # ===========================================================================
  # STAGE 2: BUILD (Production Frontend SPA Bundle)
  # ===========================================================================
  build:
    name: "2. Build Production Assets"
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Dashboard bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload Frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsentinel-frontend-dist
          path: frontend/dist
          retention-days: 7

  # ===========================================================================
  # STAGE 3: DOCKER IMAGE (Multi-Container Compose Build, E2E Smoke & GHCR Push)
  # ===========================================================================
  docker-image:
    name: "3. Docker Image & Compose E2E Smoke Test"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & boot full Docker Compose stack (Frontend + Backend + pgvector + Redis)
        run: |
          docker compose build
          docker compose up -d --wait

      - name: Run E2E smoke test against containerized OPSENTINEL stack
        run: |
          echo "Verifying containerized health probe via Nginx -> FastAPI..."
          HEALTH=$(curl -fsS http://127.0.0.1:3000/api/v1/system/health)
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='healthy' and d['database']['pgvector_native'] is True"

          echo "Verifying containerized RAG & Root Cause Analysis investigation..."
          INV=$(curl -fsS -X POST http://127.0.0.1:3000/api/v1/investigate \
            -H "Content-Type: application/json" \
            -d '{"query":"Why did the payment API start returning 500 errors after the latest deployment?"}')
          echo "$INV" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['relevant_runbook']['id']=='RB-DB-POOL-001' and len(d['matching_log_patterns'])>=3"
          docker compose down -v

      - name: Log in to GitHub Container Registry (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push Backend and Frontend Docker images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${OWNER_LC}/opsentinel-backend:${{ github.sha }} -t ghcr.io/${OWNER_LC}/opsentinel-backend:latest ./backend
          docker build -t ghcr.io/${OWNER_LC}/opsentinel-frontend:${{ github.sha }} -t ghcr.io/${OWNER_LC}/opsentinel-frontend:latest ./frontend
          docker push ghcr.io/${OWNER_LC}/opsentinel-backend:${{ github.sha }}
          docker push ghcr.io/${OWNER_LC}/opsentinel-backend:latest
          docker push ghcr.io/${OWNER_LC}/opsentinel-frontend:${{ github.sha }}
          docker push ghcr.io/${OWNER_LC}/opsentinel-frontend:latest

  # ===========================================================================
  # STAGE 4: DEPLOYMENT (Rollout Verification / Production Webhook Trigger)
  # ===========================================================================
  deployment:
    name: "4. Deployment Rollout"
    needs: docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production Docker Compose specification
        run: docker compose config --quiet

      - name: Trigger Production Deployment Webhook (if configured on main)
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"commit\":\"${{ github.sha }}\",\"service\":\"opsentinel\"}"
          else
            echo "No DEPLOY_WEBHOOK_URL secret configured; skipping external webhook trigger."
          fi

      - name: Publish CI/CD Summary
        run: |
          {
            echo "## 🚀 OPSENTINEL CI/CD Pipeline Complete"
            echo "- **Tests:** Backend Ruff + Pytest (PostgreSQL 16 + pgvector + Redis 7) & Frontend Vitest passed"
            echo "- **Build:** React 18 + TypeScript SPA production bundle verified"
            echo "- **Docker:** 4-service stack (\`frontend\`, \`backend\`, \`postgres/pgvector\`, \`redis\`) E2E verified"
            echo "- **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
